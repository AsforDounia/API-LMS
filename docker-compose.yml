version: '3.8'

services:
  api:
    build:
      context: .
      target: base
    command: bun run start:dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - MONGO_URI=mongodb://db:27017/edtech_nest
      - JWT_SECRET=${JWT_SECRET:-secret_key_123}
      - PORT=3000
    depends_on:
      - db

  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
